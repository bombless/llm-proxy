<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM Proxy</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17181a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1250px;margin:36px auto;padding:0 18px}h1{margin:0 0 6px;font-size:28px}p{color:#666}.card{background:#fff;border:1px solid #e3e5e8;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #00000008}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font-size:19px}.row{display:grid;grid-template-columns:1fr 1.3fr .9fr 1fr auto auto auto auto;gap:8px;margin:10px 0;align-items:center}.row input{min-width:0;padding:10px 11px;border:1px solid #d8dadd;border-radius:8px;font-size:14px}.btn{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:#17181a;color:white;white-space:nowrap}.btn.secondary{background:#eceef0;color:#222}.btn.danger{background:#d83b3b}.btn:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:8px;margin-top:14px}.check{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px}.check input{width:18px;height:18px}.status{position:fixed;right:18px;bottom:18px;background:#17181a;color:#fff;padding:10px 14px;border-radius:9px;display:none;max-width:min(600px,calc(100vw - 36px));white-space:pre-wrap}.hint{font-size:13px;color:#777}.empty{color:#999;padding:10px 0}.result{grid-column:1/-1;background:#f6f7f9;border-radius:9px;padding:10px;white-space:pre-wrap;word-break:break-word;font-size:13px;display:block}.benchmark{margin-top:18px}.benchmark-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.benchmark-head h2{margin:0;font-size:19px}.bench-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}.bench-table th,.bench-table td{padding:10px 8px;border-bottom:1px solid #e8e9eb;text-align:left;vertical-align:top}.bench-table th{color:#666;font-weight:600}.bench-ok{font-weight:600}.bench-error{color:#b42318}.bench-running{color:#666}.bench-text{max-width:420px;max-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-word}.bench-summary{margin-top:10px;color:#666;font-size:13px}.metric{font-variant-numeric:tabular-nums;white-space:nowrap}@media(max-width:1100px){.row{grid-template-columns:1fr 1fr}.bench-table{display:block;overflow-x:auto;white-space:nowrap}}@media(max-width:600px){.row{grid-template-columns:1fr}.benchmark-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap"><h1>LLM Proxy</h1><p>把多个 OpenAI-compatible 接口汇集到统一的 <code>/v1</code> 地址。Responses 配置可以选择直接代理 Responses，或由本服务转换成 Chat Completions，并在本地维护 <code>previous_response_id</code> 状态。</p><div class="card benchmark"><div class="benchmark-head"><div><h2>模型性能测试</h2><div class="hint">逐个测试所有已启用配置：要求模型生成约 200 字中文，测量首字延迟（TTFT）和生成速度。</div></div><button id="test-all" class="btn" onclick="testAll()">测试所有配置</button></div><div id="benchmark-results" class="empty">点击按钮开始测试。</div></div><div id="app"></div></div>
<div id="status" class="status"></div>
<script>
let state={chat_completions:[],responses:[]};
let savedState={chat_completions:[],responses:[]};
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function rowSnapshot(x){return {id:x.id,public_model:x.public_model,url:x.url,key:x.key,upstream_model:x.upstream_model,use_proxy:x.use_proxy,proxy_from_chat_completions:x.proxy_from_chat_completions,enabled:x.enabled}}
function isRowSaved(type,x){const saved=(savedState[type]||[]).find(y=>y.id===x.id);return !!saved&&JSON.stringify(rowSnapshot(saved))===JSON.stringify(rowSnapshot(x))}
function section(type,title){const a=state[type]||[];return '<div class="card"><div class="head"><h2>'+title+'</h2><button class="btn secondary" onclick="addRow(\''+type+'\')">+ 添加</button></div><div class="hint">公开模型名 → 上游地址 / Key / 上游模型名 / 代理</div><div id="rows-'+type+'">'+(a.length?a.map((x,i)=>row(type,x,i)).join(''):'<div class="empty">还没有配置。</div>')+'</div></div>'}
function row(type,x,i){const rid='result-'+type+'-'+i;const responseOption=type==='responses'?'<label class="check"><input type="checkbox" '+(x.proxy_from_chat_completions===true?'checked':'')+' onchange="edit(\''+type+'\','+i+',\'proxy_from_chat_completions\',this.checked)">从 Chat Completions 代理</label>':'';const testButton=isRowSaved(type,x)?'<button class="btn secondary" onclick="testRow(\''+type+'\','+i+')">测试“你好”</button>':'';return '<div class="row"><input placeholder="公开模型名，如 gpt-4" value="'+esc(x.public_model)+'" oninput="edit(\''+type+'\','+i+',\'public_model\',this.value)"><input placeholder="接口地址，如 https://.../v1/chat/completions" value="'+esc(x.url)+'" oninput="edit(\''+type+'\','+i+',\'url\',this.value)"><input type="password" placeholder="API Key" value="'+esc(x.key)+'" oninput="edit(\''+type+'\','+i+',\'key\',this.value)"><input placeholder="上游模型名" value="'+esc(x.upstream_model)+'" oninput="edit(\''+type+'\','+i+',\'upstream_model\',this.value)"><label class="check"><input type="checkbox" '+(x.use_proxy!==false?'checked':'')+' onchange="edit(\''+type+'\','+i+',\'use_proxy\',this.checked)">SOCKS5</label>'+responseOption+testButton+'<button class="btn danger" onclick="delRow(\''+type+'\','+i+')">删除</button><div id="'+rid+'" class="result" style="display:none"></div></div>'}
function edit(t,i,k,v){state[t][i][k]=v;updateTestButtons(t)}
function updateTestButtons(t){const container=document.getElementById('rows-'+t);if(!container)return;(state[t]||[]).forEach((x,i)=>{const rowEl=container.children[i];if(!rowEl)return;const buttons=rowEl.querySelectorAll('button.btn.secondary');const resultButton=[...buttons].find(b=>b.textContent.includes('测试“你好”'));if(isRowSaved(t,x)){if(!resultButton){const delButton=rowEl.querySelector('button.btn.danger');const btn=document.createElement('button');btn.className='btn secondary';btn.textContent='测试“你好”';btn.onclick=()=>testRow(t,i);delButton.before(btn)}}else if(resultButton){resultButton.remove()}})}
function addRow(t){state[t].push({id:String(Date.now()+Math.random()),public_model:'',url:'',key:'',upstream_model:'',use_proxy:true,proxy_from_chat_completions:false,enabled:true});render()}
function delRow(t,i){state[t].splice(i,1);render()}
async function load(){state=await (await fetch('/api/config')).json();savedState=JSON.parse(JSON.stringify(state));render()}
async function save(){const r=await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});if(!r.ok){flash('保存失败');return}state=await r.json();savedState=JSON.parse(JSON.stringify(state));render();flash('已保存')}
async function testRow(t,i){const x=state[t][i];if(!isRowSaved(t,x))return;const el=document.getElementById('result-'+t+'-'+i);el.style.display='block';el.className='result';el.textContent='测试中...';try{const r=await fetch('/api/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:t,id:x.id})});const d=await r.json();if(!r.ok)throw new Error(d.error||'测试失败');el.textContent='HTTP '+d.status+'\n'+d.text}catch(e){el.className='result error';el.textContent=e.message}}
function formatMs(v){return v==null?'—':v+' ms'}
function formatSpeed(r){if(r.tokens_per_second!=null)return r.tokens_per_second+' tok/s';if(r.chars_per_second!=null)return r.chars_per_second+' 字符/s';return '—'}
function renderBenchmark(results,running){const el=document.getElementById('benchmark-results');if(!results.length){el.className='empty';el.textContent=running?'正在寻找可测试配置…':'没有可测试的已启用配置。';return}let html='<table class="bench-table"><thead><tr><th>类型</th><th>模型</th><th>状态</th><th>首字延迟</th><th>生成速度</th><th>生成量</th><th>总耗时</th><th>回复</th></tr></thead><tbody>';for(const r of results){const ok=r.ok;html+='<tr><td>'+esc(r.type==='responses'?'Responses':'Chat Completions')+'</td><td><strong>'+esc(r.model)+'</strong>'+(r.upstream_model&&r.upstream_model!==r.model?'<div class="hint">→ '+esc(r.upstream_model)+'</div>':'')+'</td><td class="'+(ok?'bench-ok':'bench-error')+'">'+(ok?'完成':'失败')+(r.status?' · HTTP '+r.status:'')+(r.error?'<div>'+esc(r.error)+'</div>':'')+'</td><td class="metric">'+formatMs(r.ttft_ms)+'</td><td class="metric">'+formatSpeed(r)+(r.completion_tokens!=null?' <span class="hint">('+r.completion_tokens+' tok)</span>':'')+'</td><td class="metric">'+(r.generated_chars!=null?r.generated_chars+' 字符':'—')+'</td><td class="metric">'+formatMs(r.total_ms)+'</td><td><div class="bench-text">'+esc(r.text||'')+'</div></td></tr>'}html+='</tbody></table>';const done=results.length;const failed=results.filter(r=>!r.ok).length;el.className='';el.innerHTML=html+'<div class="bench-summary">已完成 '+done+' 个配置'+(failed?'，失败 '+failed+' 个':'')+'。TTFT 从请求发出开始计算，到收到第一个文本增量为止；生成速度优先使用上游返回的 completion/output tokens 计算，否则显示字符/秒。</div>'}
async function testAll(){const btn=document.getElementById('test-all');btn.disabled=true;btn.textContent='测试中…';renderBenchmark([],true);try{const r=await fetch('/api/test-all',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'批量测试失败');renderBenchmark(d.results,false);flash('所有配置测试完成')}catch(e){const el=document.getElementById('benchmark-results');el.className='result error';el.textContent='批量测试失败：'+e.message;flash('批量测试失败')}finally{btn.disabled=false;btn.textContent='测试所有配置'}}
function flash(s){const el=document.getElementById('status');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',1800)}
function render(){document.getElementById('app').innerHTML=section('chat_completions','Chat Completions')+section('responses','Responses')+'<div class="actions"><button class="btn" onclick="save()">保存配置</button><button class="btn secondary" onclick="load()">重新加载</button></div>'} load();
</script>
</body>
</html>
