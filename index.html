<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM Proxy</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17181a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1250px;margin:36px auto;padding:0 18px}h1{margin:0 0 6px;font-size:28px}p{color:#666}.card{background:#fff;border:1px solid #e3e5e8;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #00000008}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font-size:19px}.row{display:grid;grid-template-columns:1fr 1.3fr .9fr 1fr auto auto auto auto;gap:8px;margin:10px 0;align-items:center}.row input{min-width:0;padding:10px 11px;border:1px solid #d8dadd;border-radius:8px;font-size:14px}.btn{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:#17181a;color:#fff;white-space:nowrap}.btn.secondary{background:#eceef0;color:#222}.btn.danger{background:#d83b3b}.btn:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:8px;margin-top:14px}.check{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px}.check input{width:18px;height:18px}.hint{font-size:13px;color:#777}.empty{color:#999;padding:10px 0}.status{position:fixed;right:18px;bottom:18px;background:#17181a;color:#fff;padding:10px 14px;border-radius:9px;display:none;max-width:min(600px,calc(100vw - 36px));white-space:pre-wrap}.result{grid-column:1/-1;background:#f6f7f9;border-radius:9px;padding:10px;white-space:pre-wrap;word-break:break-word;font-size:13px}.benchmark-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.benchmark-head h2{margin:0;font-size:19px}.bench-table,.stat-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}.bench-table th,.bench-table td,.stat-table th,.stat-table td{padding:9px 7px;border-bottom:1px solid #e8e9eb;text-align:left;vertical-align:top}.bench-table th,.stat-table th{color:#666;font-weight:600}.bench-ok{font-weight:600}.bench-error{color:#b42318}.bench-text{max-width:420px;max-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-word}.bench-summary{margin-top:10px;color:#666;font-size:13px}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;margin-top:14px}.stat-card{border:1px solid #e5e7ea;border-radius:11px;padding:14px;background:#fafbfc}.stat-title{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.stat-title strong{font-size:15px}.stat-empty{padding:16px 0;color:#999;font-size:13px}.metric{font-variant-numeric:tabular-nums;white-space:nowrap}@media(max-width:1100px){.row{grid-template-columns:1fr 1fr}.bench-table,.stat-table{display:block;overflow-x:auto;white-space:nowrap}.stats-grid{grid-template-columns:1fr}}@media(max-width:600px){.row{grid-template-columns:1fr}.benchmark-head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><h1>LLM Proxy</h1><p>把多个 OpenAI-compatible 接口汇集到统一的 <code>/v1</code> 地址。可直接代理 Responses，也可转换成 Chat Completions。</p>
<div class="card"><div class="head"><div><h2>调用统计</h2><div class="hint">实际流式调用会自动记录最近 10 次；TTFT 为请求发出到首个文本增量。</div></div><button class="btn secondary" onclick="loadStats()">刷新</button></div><div id="stats" class="stats-grid"><div class="empty">加载中…</div></div><div class="actions"><button class="btn danger" onclick="clearStats()">清空统计</button></div></div>
<div class="card"><div class="benchmark-head"><div><h2>模型性能测试</h2><div class="hint">逐个测试所有已启用配置：生成约 200 字中文并测量 TTFT、生成速度。</div></div><button id="test-all" class="btn" onclick="testAll()">测试所有配置</button></div><div id="benchmark-results" class="empty">点击按钮开始测试。</div></div><div id="app"></div></div><div id="status" class="status"></div>
<script>
let state={chat_completions:[],responses:[]},savedState={chat_completions:[],responses:[]};
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function snap(x){return {id:x.id,public_model:x.public_model,url:x.url,key:x.key,upstream_model:x.upstream_model,use_proxy:x.use_proxy,proxy_from_chat_completions:x.proxy_from_chat_completions,enabled:x.enabled}}
function saved(t,x){const y=(savedState[t]||[]).find(v=>v.id===x.id);return !!y&&JSON.stringify(snap(y))===JSON.stringify(snap(x))}
function section(t,title){const a=state[t]||[];return '<div class="card"><div class="head"><h2>'+title+'</h2><button class="btn secondary" onclick="addRow(\''+t+'\')">+ 添加</button></div><div class="hint">公开模型名 → 上游地址 / Key / 上游模型名 / 代理</div><div id="rows-'+t+'">'+(a.length?a.map((x,i)=>row(t,x,i)).join(''):'<div class="empty">还没有配置。</div>')+'</div></div>'}
function row(t,x,i){const b=saved(t,x)?'<button class="btn secondary" onclick="testRow(\''+t+'\','+i+')">测试“你好”</button>':'';const ro=t==='responses'?'<label class="check"><input type="checkbox" '+(x.proxy_from_chat_completions?'checked':'')+' onchange="edit(\''+t+'\','+i+',\'proxy_from_chat_completions\',this.checked)">从 Chat Completions 代理</label>':'';return '<div class="row"><input placeholder="公开模型名，如 gpt-4" value="'+esc(x.public_model)+'" oninput="edit(\''+t+'\','+i+',\'public_model\',this.value)"><input placeholder="接口地址，如 https://.../v1/chat/completions" value="'+esc(x.url)+'" oninput="edit(\''+t+'\','+i+',\'url\',this.value)"><input type="password" placeholder="API Key" value="'+esc(x.key)+'" oninput="edit(\''+t+'\','+i+',\'key\',this.value)"><input placeholder="上游模型名" value="'+esc(x.upstream_model)+'" oninput="edit(\''+t+'\','+i+',\'upstream_model\',this.value)"><label class="check"><input type="checkbox" '+(x.use_proxy!==false?'checked':'')+' onchange="edit(\''+t+'\','+i+',\'use_proxy\',this.checked)">SOCKS5</label>'+ro+b+'<button class="btn danger" onclick="delRow(\''+t+'\','+i+')">删除</button></div><div id="result-'+t+'-'+i+'" class="result" style="display:none"></div>'}
function edit(t,i,k,v){state[t][i][k]=v;render()}
function addRow(t){state[t].push({id:String(Date.now()+Math.random()),public_model:'',url:'',key:'',upstream_model:'',use_proxy:true,proxy_from_chat_completions:false,enabled:true});render()}
function delRow(t,i){state[t].splice(i,1);render()}
async function load(){state=await (await fetch('/api/config')).json();savedState=JSON.parse(JSON.stringify(state));render()}
async function save(){const r=await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});if(!r.ok)return flash('保存失败');state=await r.json();savedState=JSON.parse(JSON.stringify(state));render();flash('已保存')}
async function testRow(t,i){const x=state[t][i],el=document.getElementById('result-'+t+'-'+i);if(!saved(t,x)||!el)return;el.style.display='block';el.textContent='测试中...';try{const r=await fetch('/api/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:t,id:x.id})}),d=await r.json();if(!r.ok)throw Error(d.error||'测试失败');el.textContent='HTTP '+d.status+'\n'+d.text}catch(e){el.textContent=e.message}}
function fmt(v){return v==null?'—':v}function speed(x){return x.tokens_per_second!=null?x.tokens_per_second+' tok/s':x.chars_per_second!=null?x.chars_per_second+' 字符/s':'—'}
function renderStats(data){const el=document.getElementById('stats'),cards=[];for(const t of ['chat_completions','responses'])for(const x of data[t]||[]){const s=x.samples||[];cards.push('<div class="stat-card"><div class="stat-title"><strong>'+esc(x.public_model)+'</strong><span class="hint">'+(t==='responses'?'Responses':'Chat Completions')+'</span></div>'+(s.length?'<table class="stat-table"><thead><tr><th>时间</th><th>首字时间</th><th>生成速度</th><th>总耗时</th></tr></thead><tbody>'+s.slice().reverse().map(v=>'<tr><td>'+esc(new Date(v.timestamp).toLocaleString())+'</td><td class="metric">'+fmt(v.ttft_ms)+' ms</td><td class="metric">'+speed(v)+'</td><td class="metric">'+fmt(v.total_ms)+' ms</td></tr>').join('')+'</tbody></table>':'<div class="stat-empty">暂无流式调用数据。</div>')+'</div>')}el.innerHTML=cards.length?cards.join(''):'<div class="empty">暂无配置。</div>'}
async function loadStats(){try{const r=await fetch('/api/metrics');if(!r.ok)throw Error();renderStats(await r.json())}catch(e){document.getElementById('stats').innerHTML='<div class="empty">统计加载失败。</div>'}}
async function clearStats(){if(!confirm('确定清空所有调用统计？'))return;const r=await fetch('/api/metrics',{method:'DELETE'});if(r.ok){await loadStats();flash('统计已清空')}}
function ms(v){return v==null?'—':v+' ms'}function sp(r){return r.tokens_per_second!=null?r.tokens_per_second+' tok/s':r.chars_per_second!=null?r.chars_per_second+' 字符/s':'—'}
function renderBenchmark(rs,running){const el=document.getElementById('benchmark-results');if(!rs.length){el.className='empty';el.textContent=running?'正在测试…':'没有可测试的已启用配置。';return}let h='<table class="bench-table"><thead><tr><th>类型</th><th>模型</th><th>状态</th><th>TTFT</th><th>生成速度</th><th>生成量</th><th>总耗时</th><th>回复</th></tr></thead><tbody>';for(const r of rs)h+='<tr><td>'+esc(r.type==='responses'?'Responses':'Chat Completions')+'</td><td><strong>'+esc(r.model)+'</strong></td><td class="'+(r.ok?'bench-ok':'bench-error')+'">'+(r.ok?'完成':'失败')+(r.status?' · HTTP '+r.status:'')+(r.error?'<div>'+esc(r.error)+'</div>':'')+'</td><td class="metric">'+ms(r.ttft_ms)+'</td><td class="metric">'+sp(r)+'</td><td class="metric">'+(r.generated_chars!=null?r.generated_chars+' 字符':'—')+'</td><td class="metric">'+ms(r.total_ms)+'</td><td><div class="bench-text">'+esc(r.text||'')+'</div></td></tr>';h+='</tbody></table><div class="bench-summary">共 '+rs.length+' 个配置。TTFT 从请求发出到首个文本增量；生成速度优先使用 token usage，否则使用字符/秒。</div>';el.className='';el.innerHTML=h}
async function testAll(){const b=document.getElementById('test-all');b.disabled=true;b.textContent='测试中…';renderBenchmark([],true);try{const r=await fetch('/api/test-all',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'批量测试失败');renderBenchmark(d.results,false);flash('所有配置测试完成')}catch(e){document.getElementById('benchmark-results').textContent='批量测试失败：'+e.message}finally{b.disabled=false;b.textContent='测试所有配置'}}
function flash(s){const e=document.getElementById('status');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function render(){document.getElementById('app').innerHTML=section('chat_completions','Chat Completions')+section('responses','Responses')+'<div class="actions"><button class="btn" onclick="save()">保存配置</button><button class="btn secondary" onclick="load()">重新加载</button></div>'}
Promise.all([load().catch(()=>flash('配置加载失败')),loadStats()]);setInterval(loadStats,10000);
</script></body></html>
