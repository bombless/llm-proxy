<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM Proxy</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17181a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1250px;margin:36px auto;padding:0 18px}h1{margin:0 0 6px;font-size:28px}p{color:#666}.card{background:#fff;border:1px solid #e3e5e8;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #00000008}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font-size:19px}.row{display:grid;grid-template-columns:1fr 1.3fr .9fr 1fr auto auto auto;gap:8px;margin:10px 0;align-items:center}.row input{min-width:0;padding:10px 11px;border:1px solid #d8dadd;border-radius:8px;font-size:14px}.btn{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:#17181a;color:#fff;white-space:nowrap}.btn.secondary{background:#eceef0;color:#222}.btn.danger{background:#d83b3b}.btn:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:8px;margin-top:14px}.check{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px}.check input{width:18px;height:18px}.hint{font-size:13px;color:#777}.empty{color:#999;padding:10px 0}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;margin-top:14px}.stat-card{border:1px solid #e5e7ea;border-radius:11px;padding:14px;background:#fafbfc}.stat-title{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.stat-title strong{font-size:15px}.stat-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.stat-table th,.stat-table td{padding:8px 6px;border-bottom:1px solid #e7e9ec;text-align:left;white-space:nowrap}.stat-table th{color:#666;font-weight:600}.metric{font-variant-numeric:tabular-nums}.stat-empty{padding:16px 0;color:#999;font-size:13px}.status{position:fixed;right:18px;bottom:18px;background:#17181a;color:#fff;padding:10px 14px;border-radius:9px;display:none;max-width:min(600px,calc(100vw - 36px))}@media(max-width:1100px){.row{grid-template-columns:1fr 1fr}.stats-grid{grid-template-columns:1fr}}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>LLM Proxy</h1>
<p>把多个 OpenAI-compatible 接口汇集到统一的 <code>/v1</code> 地址。下面的统计会在实际流式调用经过代理时自动记录，不需要额外的测试请求；每个配置保留最近 10 次。</p>
<div class="card"><div class="head"><div><h2>调用统计</h2><div class="hint">TTFT = 请求发出到收到第一个文本增量；生成速度优先使用上游返回的 token usage，否则使用字符/秒。</div></div><button id="refresh-stats" class="btn secondary" onclick="loadStats()">刷新</button></div><div id="stats" class="stats-grid"><div class="empty">加载中…</div></div><div class="actions"><button class="btn danger" onclick="clearStats()">清空统计</button></div></div>
<div id="app"></div>
</div><div id="status" class="status"></div>
<script>
let state={chat_completions:[],responses:[]};let savedState={chat_completions:[],responses:[]};
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function rowSnapshot(x){return {id:x.id,public_model:x.public_model,url:x.url,key:x.key,upstream_model:x.upstream_model,use_proxy:x.use_proxy,proxy_from_chat_completions:x.proxy_from_chat_completions,enabled:x.enabled}}
function isRowSaved(t,x){const s=(savedState[t]||[]).find(y=>y.id===x.id);return !!s&&JSON.stringify(rowSnapshot(s))===JSON.stringify(rowSnapshot(x))}
function section(type,title){const a=state[type]||[];return '<div class="card"><div class="head"><h2>'+title+'</h2><button class="btn secondary" onclick="addRow(\''+type+'\')">+ 添加</button></div><div class="hint">公开模型名 → 上游地址 / Key / 上游模型名 / 代理</div><div id="rows-'+type+'">'+(a.length?a.map((x,i)=>row(type,x,i)).join(''):'<div class="empty">还没有配置。</div>')+'</div></div>'}
function row(type,x,i){const responseOption=type==='responses'?'<label class="check"><input type="checkbox" '+(x.proxy_from_chat_completions===true?'checked':'')+' onchange="edit(\''+type+'\','+i+',\'proxy_from_chat_completions\',this.checked)">从 Chat Completions 代理</label>':'';return '<div class="row"><input placeholder="公开模型名，如 gpt-4" value="'+esc(x.public_model)+'" oninput="edit(\''+type+'\','+i+',\'public_model\',this.value)"><input placeholder="接口地址，如 https://.../v1/chat/completions" value="'+esc(x.url)+'" oninput="edit(\''+type+'\','+i+',\'url\',this.value)"><input type="password" placeholder="API Key" value="'+esc(x.key)+'" oninput="edit(\''+type+'\','+i+',\'key\',this.value)"><input placeholder="上游模型名" value="'+esc(x.upstream_model)+'" oninput="edit(\''+type+'\','+i+',\'upstream_model\',this.value)"><label class="check"><input type="checkbox" '+(x.use_proxy!==false?'checked':'')+' onchange="edit(\''+type+'\','+i+',\'use_proxy\',this.checked)">SOCKS5</label>'+responseOption+'<button class="btn danger" onclick="delRow(\''+type+'\','+i+')">删除</button></div>'}
function edit(t,i,k,v){state[t][i][k]=v}
function addRow(t){state[t].push({id:String(Date.now()+Math.random()),public_model:'',url:'',key:'',upstream_model:'',use_proxy:true,proxy_from_chat_completions:false,enabled:true});render()}
function delRow(t,i){state[t].splice(i,1);render()}
async function load(){const r=await fetch('/api/config');if(!r.ok)throw new Error('配置加载失败');state=await r.json();savedState=JSON.parse(JSON.stringify(state));render()}
async function save(){const r=await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});if(!r.ok){flash('保存失败');return}state=await r.json();savedState=JSON.parse(JSON.stringify(state));render();flash('已保存')}
function fmt(v){return v==null?'—':v}
function speed(s){if(s.tokens_per_second!=null)return s.tokens_per_second+' tok/s';if(s.chars_per_second!=null)return s.chars_per_second+' 字符/s';return '—'}
function renderStats(data){const el=document.getElementById('stats');const cards=[];for(const type of ['chat_completions','responses'])for(const x of (data[type]||[])){const samples=x.samples||[];cards.push('<div class="stat-card"><div class="stat-title"><strong>'+esc(x.public_model)+'</strong><span class="hint">'+esc(type==='responses'?'Responses':'Chat Completions')+(x.upstream_model!==x.public_model?' · '+esc(x.upstream_model):'')+'</span></div>'+(samples.length?'<table class="stat-table"><thead><tr><th>时间</th><th>首字时间</th><th>生成速度</th></tr></thead><tbody>'+samples.slice().reverse().map(s=>'<tr><td>'+esc(new Date(s.timestamp).toLocaleString())+'</td><td class="metric">'+fmt(s.ttft_ms)+' ms</td><td class="metric">'+speed(s)+'</td></tr>').join('')+'</tbody></table>':'<div class="stat-empty">暂无流式调用数据。实际调用一次后会自动出现。</div>')+'</div>')}el.innerHTML=cards.length?cards.join(''):'<div class="empty">暂无配置。</div>'}
async function loadStats(){try{const r=await fetch('/api/metrics');if(!r.ok)throw new Error();renderStats(await r.json())}catch(e){document.getElementById('stats').innerHTML='<div class="empty">统计加载失败。</div>'}}
async function clearStats(){if(!confirm('确定清空所有调用统计？'))return;const r=await fetch('/api/metrics',{method:'DELETE'});if(r.ok){await loadStats();flash('统计已清空')}else flash('清空失败')}
function flash(s){const el=document.getElementById('status');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',1800)}
function render(){document.getElementById('app').innerHTML=section('chat_completions','Chat Completions')+section('responses','Responses')+'<div class="actions"><button class="btn" onclick="save()">保存配置</button><button class="btn secondary" onclick="load().catch(()=>flash(\'配置加载失败\'))">重新加载</button></div>'}
Promise.all([load().catch(()=>flash('配置加载失败')),loadStats()]);setInterval(loadStats,10000);
</script></body></html>
